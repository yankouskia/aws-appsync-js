name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! A minimal reproduction makes a huge difference.
  - type: input
    id: version
    attributes:
      label: aws-appsync-js version
      placeholder: '1.0.0'
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime (Node version / browser / edge)
      placeholder: 'Node 20.11.0'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A code snippet or repo link that demonstrates the issue.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Include the error message + stack trace if any.
    validations:
      required: true
